# Infrastructure only (default):   docker compose up -d
# Infrastructure + all services:   docker compose --profile apps up -d --build
x-app-env: &app-env
  EUREKA_URL: http://service-registry:8761/eureka
  CONFIG_SERVER_URL: http://config-server:8888
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  SCHEMA_REGISTRY_URL: http://schema-registry:8081
  DB_HOST: postgres
  DB_USER: postgres
  DB_PASSWORD: postgres
  MONGO_URI: mongodb://mongo:27017/catalog
  ZIPKIN_URL: http://zipkin:9411/api/v2/spans
  JWT_SECRET: change-me-change-me-change-me-0123456789
  EUREKA_HOSTNAME: service-registry

services:
  # ---------------------------- infrastructure ----------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.3
    hostname: schema-registry
    depends_on: [kafka]
    ports: ["8085:8081"]          # 8081 on the host is the order-service
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  postgres:
    image: postgres:16
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongodata:/data/db]

  zipkin:
    image: openzipkin/zipkin:3
    ports: ["9411:9411"]

  prometheus:
    image: prom/prometheus:v2.53.0
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus-local.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts: ["host.docker.internal:host-gateway"]

  # ---------------------------- application services (profile: apps) ----------------------------
  service-registry:
    profiles: [apps]
    build: {context: ./backend, args: {MODULE: service-registry}}
    ports: ["8761:8761"]
    environment: *app-env

  config-server:
    profiles: [apps]
    build: {context: ./backend, args: {MODULE: config-server}}
    ports: ["8888:8888"]
    environment: *app-env

  api-gateway:
    profiles: [apps]
    build: {context: ./backend, args: {MODULE: api-gateway}}
    ports: ["8080:8080"]
    depends_on: [service-registry]
    environment: *app-env

  order-service:
    profiles: [apps]
    build: {context: ./backend, args: {MODULE: order-service}}
    ports: ["8081:8081"]
    depends_on:
      postgres: {condition: service_healthy}
      schema-registry: {condition: service_started}
      service-registry: {condition: service_started}
    environment:
      <<: *app-env
      DB_NAME: orderdb

  inventory-service:
    profiles: [apps]
    build: {context: ./backend, args: {MODULE: inventory-service}}
    ports: ["8082:8082"]
    depends_on:
      postgres: {condition: service_healthy}
      schema-registry: {condition: service_started}
      service-registry: {condition: service_started}
    environment:
      <<: *app-env
      DB_NAME: inventorydb

  payment-service:
    profiles: [apps]
    build: {context: ./backend, args: {MODULE: payment-service}}
    ports: ["8083:8083"]
    depends_on:
      postgres: {condition: service_healthy}
      schema-registry: {condition: service_started}
      service-registry: {condition: service_started}
    environment:
      <<: *app-env
      DB_NAME: paymentdb

  notification-service:
    profiles: [apps]
    build: {context: ./backend, args: {MODULE: notification-service}}
    ports: ["8084:8084"]
    depends_on:
      schema-registry: {condition: service_started}
      service-registry: {condition: service_started}
    environment: *app-env

  frontend:
    profiles: [apps]
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [api-gateway]
    environment:
      GATEWAY_URL: http://api-gateway:8080

volumes:
  pgdata:
  mongodata:
