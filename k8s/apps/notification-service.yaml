apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecommerce
  labels: {app: notification-service}
spec:
  replicas: 1
  selector:
    matchLabels: {app: notification-service}
  template:
    metadata:
      labels: {app: notification-service}
    spec:
      enableServiceLinks: false
      containers:
        - name: notification-service
          image: ecommerce/notification-service:1.0.0
          imagePullPolicy: IfNotPresent     # images are built into the local Docker daemon (Minikube / Docker Desktop)
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef: {name: ecommerce-config}
            - secretRef: {name: ecommerce-secrets}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8084}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8084}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8084}
            periodSeconds: 15
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ecommerce
spec:
  selector: {app: notification-service}
  ports:
    - port: 8084
      targetPort: 8084
