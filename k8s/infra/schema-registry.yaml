apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels: {app: schema-registry}
  template:
    metadata:
      labels: {app: schema-registry}
    spec:
      enableServiceLinks: false
      containers:
        - name: schema-registry
          image: confluentinc/cp-schema-registry:7.5.3
          ports: [{containerPort: 8081}]
          env:
            - {name: SCHEMA_REGISTRY_HOST_NAME, value: schema-registry}
            - {name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS, value: "kafka:9092"}
            - {name: SCHEMA_REGISTRY_LISTENERS, value: "http://0.0.0.0:8081"}
          readinessProbe:
            httpGet: {path: /subjects, port: 8081}
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: ecommerce
spec:
  selector: {app: schema-registry}
  ports: [{port: 8081, targetPort: 8081}]
