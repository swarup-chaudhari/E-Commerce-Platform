apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels: {app: zipkin}
  template:
    metadata:
      labels: {app: zipkin}
    spec:
      enableServiceLinks: false
      containers:
        - name: zipkin
          image: openzipkin/zipkin:3
          ports: [{containerPort: 9411}]
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: ecommerce
spec:
  type: NodePort
  selector: {app: zipkin}
  ports: [{port: 9411, targetPort: 9411, nodePort: 30411}]
