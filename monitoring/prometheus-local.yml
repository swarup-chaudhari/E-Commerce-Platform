# Used by docker-compose. Scrapes services either running on the host (IDE/mvn) or in compose (profile "apps").
global:
  scrape_interval: 10s
scrape_configs:
  - job_name: ecommerce-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080   # api-gateway
          - host.docker.internal:8081   # order-service
          - host.docker.internal:8082   # inventory-service
          - host.docker.internal:8083   # payment-service
          - host.docker.internal:8084   # notification-service
